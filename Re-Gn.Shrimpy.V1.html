    --primary-hover: #ffa67c;

    --primary-lighter: rgba(255, 166, 124, 0.06);
    --accent: #ffc5ab;
    --accent-light: rgba(255, 197, 171, 0.12);
    --success: #ffe7db;
    --warning: #ffc5ab;
    --text: #1a1a1a;

    --text-light: #9ca3af;
    --bg: #fff3ec;
    --bg-secondary: #ffe7db;

    --surface-hover: #ffe7db;

}

.dark-mode {
    /* Shrimp Mode: bright, colorful, all-shrimp-palette (no external colors) */

        function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

        // Ensure particle layer exists
        function ensureParticles(){
            if (document.querySelector('.particle-layer')) return;
            const layer = document.createElement('div');
            layer.className = 'particle-layer';
            // create multiple particles with slight randomization
            for (let i=0;i<8;i++){
                const p = document.createElement('div');
                p.className = 'particle p'+((i%4)+1);
                // randomize start positions
                p.style.left = (5 + Math.random()*90) + '%';
                p.style.top = (40 + Math.random()*50) + '%';
                p.style.opacity = 0.4 + Math.random()*0.5;
                p.style.width = (10 + Math.random()*28) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (14 + Math.random()*18) + 's';
                layer.appendChild(p);
            }
            document.body.appendChild(layer);
        }

        // Cards: occasional breathing; always reschedule even if none yet
        function getCards(){ return Array.from(document.querySelectorAll('.zone-item, .card')); }
        function pulseRandomCard(){
            const list = getCards();
            if (list.length){
                const el = list[Math.floor(Math.random()*list.length)];
                // avoid triggering on elements already animating
                if (!el.classList.contains('card-breathe')){
                    // restart animation reliably
                    el.classList.remove('card-breathe');
                    // force reflow
                    void el.offsetWidth;
                    el.classList.add('card-breathe');
                    setTimeout(()=> el.classList.remove('card-breathe'), 2600);
                    // small particle burst when card breathes
                    burstAt(el);
                }
            }
            // schedule next regardless (so it keeps trying until cards appear)
            setTimeout(pulseRandomCard, rand(3000, 9000));
        }

        // small burst of temporary particles near an element
        function burstAt(el){
            try{
                const rect = el.getBoundingClientRect();
                const count = 6;
                const burst = document.createElement('div');
                burst.style.position='fixed'; burst.style.left='0'; burst.style.top='0'; burst.style.pointerEvents='none'; burst.className='particle-burst';
                for(let i=0;i<count;i++){
                    const s = document.createElement('div');
                    s.className='particle';
                    s.style.width='8px'; s.style.height='8px'; s.style.borderRadius='50%';
                    s.style.left=(rect.left + rect.width/2 + (Math.random()-0.5)*rect.width/1.5)+'px';
                    s.style.top=(rect.top + rect.height/2 + (Math.random()-0.5)*rect.height/1.5)+'px';
                    s.style.background = ['#fff3ec','#ffe7db','#ffc5ab','#ffa67c'][Math.floor(Math.random()*4)];
                    s.style.opacity='0.9'; s.style.transform='translateY(0) scale(1)';
                    s.style.transition='transform 900ms ease-out, opacity 900ms linear';
                    burst.appendChild(s);
                    // animate
                    setTimeout(()=>{ s.style.transform = 'translateY(-40px) translateX('+(Math.random()*80-40)+'px) scale(0.6)'; s.style.opacity='0'; }, 20 + i*30);
                }
                document.body.appendChild(burst);
                setTimeout(()=> burst.remove(), 1200);
            }catch(e){/* ignore */}
        }

        // Search bar flash occasionally; always reschedule
        function flashSearch(){
            const search = document.getElementById('searchBar');
            if (search){
                search.classList.add('search-flash');
                setTimeout(()=> search.classList.remove('search-flash'), 1000);
                setTimeout(flashSearch, rand(6000, 14000));
            } else {
                // try again soon if not present
                setTimeout(flashSearch, 2000);
            }
        }

        // Spin controls occasionally; always reschedule
        function spinOne(){
            const controls = [document.getElementById('refresh'), document.getElementById('settings')].filter(Boolean);
            if (controls.length){
                const el = controls[Math.floor(Math.random()*controls.length)];
                if (!el.classList.contains('idle-spin')){
                    el.classList.add('idle-spin');
                    setTimeout(()=> el.classList.remove('idle-spin'), 1200);
                }
            }
            setTimeout(spinOne, rand(8000, 20000));
        }

        // logo pulse/shimmer occasionally
        function logoFlick(){
            const logo = document.querySelector('.logo');
            if (!logo) { setTimeout(logoFlick, 2000); return; }
            logo.classList.add('shimmer-text');
            setTimeout(()=> logo.classList.remove('shimmer-text'), 1400);
            setTimeout(logoFlick, rand(5000, 14000));
        }

        // Observe for dynamically added zone items so we can animate them when they appear
        function observeZones(){
            const container = document.getElementById('container') || document.body;
            const mo = new MutationObserver(muts=>{
                for(const m of muts){
                    for(const n of m.addedNodes){
                        if (!(n instanceof HTMLElement)) continue;
                        if (n.classList && (n.classList.contains('zone-item') || n.classList.contains('card'))){
                            // tiny entrance
                            n.style.opacity = 0; n.style.transform = 'translateY(8px)';
                            requestAnimationFrame(()=>{ n.style.transition='opacity 420ms ease, transform 420ms ease'; n.style.opacity=1; n.style.transform='translateY(0)'; setTimeout(()=>{ n.style.transition=''; },500); });
                        }
                        // if many children added, scan for zone-item inside
                        const found = n.querySelectorAll && n.querySelectorAll('.zone-item, .card');
                        if (found && found.length){
                            found.forEach(el=>{ el.style.opacity=0; el.style.transform='translateY(8px)'; requestAnimationFrame(()=>{ el.style.transition='opacity 420ms ease, transform 420ms ease'; el.style.opacity=1; el.style.transform='translateY(0)'; setTimeout(()=>{ el.style.transition=''; },500); }); });
                        }
                    }
                }
            });
            mo.observe(container, { childList: true, subtree: true });
        }

        // Init
        ensureParticles();
        observeZones();
        setTimeout(pulseRandomCard, 1200 + rand(0,1500));
        setTimeout(flashSearch, 1800 + rand(0,2000));
        setTimeout(spinOne, 2400 + rand(0,3000));
        setTimeout(logoFlick, 2600 + rand(0,3000));
    })();
    </script>

async function fetchPopularity() {
    try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files?period=year");
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[id] = file.hits.total;
            }
        });
    } catch (error) {
        popularityData[0] = 0;
    }
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') {
        zones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === 'id') {
        zones.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popular') {
        zones.sort((a, b) => (popularityData[b.id] || 0) - (popularityData[a.id] || 0));
    }
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    if (featuredContainer.innerHTML === "") {
        const featured = zones.filter(z => z.featured);
        displayFeaturedZones(featured);
    }
    displayZones(zones);
}

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') {
      return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
    }
    
    if (obj instanceof Uint8Array) {
      if (obj.length > maxArrayLen) {
        return `[Uint8Array too large (${obj.length} bytes), truncated]`;
      }
      return obj;
    }
    
    if (Array.isArray(obj)) {
      return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    }
    
    if (obj && typeof obj === 'object') {
      const newObj = {};
      for (const key in obj) {
        if (obj.hasOwnProperty(key)) {
          newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
        }
      }
      return newObj;
    }
    
    return obj;
  }

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
      if (!dbInfo.name) continue;
      result.indexedDB[dbInfo.name] = {};
      await new Promise((resolve, reject) => {
        const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
        openRequest.onerror = () => reject(openRequest.error);
        openRequest.onsuccess = () => {
          const db = openRequest.result;
          const storeNames = Array.from(db.objectStoreNames);
          if (storeNames.length === 0) {
            resolve();
            return;
          }
          const transaction = db.transaction(storeNames, "readonly");
          const storePromises = [];
          for (const storeName of storeNames) {
            result.indexedDB[dbInfo.name][storeName] = [];
            const store = transaction.objectStore(storeName);
            const getAllRequest = store.getAll();
            const p = new Promise((res, rej) => {
              getAllRequest.onsuccess = () => {
                result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                res();
              };
              getAllRequest.onerror = () => rej(getAllRequest.error);
            });
            storePromises.push(p);
          }
          Promise.all(storePromises).then(() => resolve());
        };
      });
    }

    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
      const cache = await caches.open(cacheName);
      const requests = await cache.keys();
      result.caches[cacheName] = [];
      for (const req of requests) {
        const response = await cache.match(req);
        if (!response) continue;
        const cloned = response.clone();
        const contentType = cloned.headers.get('content-type') || '';
        let body;
        try {
          if (contentType.includes('application/json')) {
            body = await cloned.json();
          } else if (contentType.includes('text') || contentType.includes('javascript')) {
            body = await cloned.text();
          } else {
            const buffer = await cloned.arrayBuffer();
            body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
          }
        } catch (e) {
          body = '[Unable to read body]';
        }
        result.caches[cacheName].push({
          url: req.url,
          body,
          contentType
        });
      }
    }
  
    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], {
        type: "application/octet-stream"
    }));
    link.download = `${Date.now()}.data`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
  
  async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) {
            data.cookies.split(';').forEach(cookie => {
              document.cookie = cookie.trim();
            });
          }
        
          if (data.localStorage) {
            for (const key in data.localStorage) {
              localStorage.setItem(key, data.localStorage[key]);
            }
          }
        
          if (data.sessionStorage) {
            for (const key in data.sessionStorage) {
              sessionStorage.setItem(key, data.sessionStorage[key]);
            }
          }
        
          if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
              const stores = data.indexedDB[dbName];
              await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = e => {
                  const db = e.target.result;
                  for (const storeName in stores) {
                    if (!db.objectStoreNames.contains(storeName)) {
                      db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                  }
                };
                request.onsuccess = e => {
                  const db = e.target.result;
                  const transaction = db.transaction(Object.keys(stores), 'readwrite');
                  transaction.onerror = () => reject(transaction.error);
                  let pendingStores = Object.keys(stores).length;
        
                  for (const storeName in stores) {
                    const objectStore = transaction.objectStore(storeName);
                    objectStore.clear().onsuccess = () => {
                      for (const item of stores[storeName]) {
                        objectStore.put(item);
                      }
                      pendingStores--;
                      if (pendingStores === 0) resolve();
                    };
                  }
                };
                request.onerror = () => reject(request.error);
              });
            }
          }
        
          if (data.caches) {
            for (const cacheName in data.caches) {
              const cache = await caches.open(cacheName);
              await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k)))); // clear existing
        
              for (const entry of data.caches[cacheName]) {
                let responseBody;
                if (entry.contentType.includes('application/json')) {
                  responseBody = JSON.stringify(entry.body);
                } else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) {
                  responseBody = entry.body;
                } else {
                  const binaryStr = atob(entry.body);
                  const len = binaryStr.length;
                  const bytes = new Uint8Array(len);
                  for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                  }
                  responseBody = bytes.buffer;
                }
                const headers = new Headers({ 'content-type': entry.contentType });
                const response = new Response(responseBody, { headers });
                await cache.put(entry.url, response);
              }
            }
          }
